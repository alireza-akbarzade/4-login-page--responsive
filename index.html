<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
    <div class="container">
        <div class="right">
            <div class="right-info">

                <form action="">

                <p class="or-text">یا</p>

                    <button>
                        <img width="20px" height="20px" src="/assets/images/googlepng.png" alt="">

                        <span class="span-sm">گوگل</span>
                    </button>
                        <button>
                        <img width="20px" height="20px"  src="/assets/images/facebookPng.png" alt="">
                        <span class="span">ورود با فیسبوک</span>
                        <span class="span-sm">فیسبوک</span>
                    </button>
                </div>
                <p class="signup-text">
                    حساب کاربری ندارید؟<a href="">ثبت نام کنید</a>
                </p>
            </div>
        </div>
        <div class="left">
            <img width="700px" height="500px" src="/assets/images/mystical-forest-3840x2160-23601.jpg" alt="">
